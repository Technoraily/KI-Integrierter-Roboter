<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Segoe UI, Arial, sans-serif" font-size="15">
  <rect width="900" height="560" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Schultergelenk J2: Zahnriemen (Stufe 1) und Seiltrieb (Stufe 2)</text>

  <!-- Oberarm, fest mit dem Segment verbunden -->
  <rect x="566" y="70" width="48" height="230" rx="10" fill="#d9dee5" stroke="#555" stroke-width="2"/>
  <text x="630" y="110" fill="#333">Oberarm</text>

  <!-- Segment: Halbscheibe, Mittelpunkt = Schulterachse (590,300), R = 168 -->
  <path d="M 422 300 A 168 168 0 0 0 758 300 Z" fill="#eef1f5" stroke="#555" stroke-width="2"/>
  <circle cx="590" cy="300" r="9" fill="#555"/>
  <text x="606" y="290" fill="#333">Schulterachse</text>
  <text x="590" y="380" text-anchor="middle" fill="#333">Seilsegment, R 84 mm</text>
  <text x="590" y="400" text-anchor="middle" fill="#333">fest am Oberarm</text>

  <!-- Seil auf dem Rand des Segments (rot), von beiden Enden zur Trommel -->
  <path d="M 434 362 A 168 168 0 0 0 566 466" fill="none" stroke="#d62828" stroke-width="5"/>
  <path d="M 746 362 A 168 168 0 0 1 614 466" fill="none" stroke="#d62828" stroke-width="5"/>
  <circle cx="434" cy="362" r="7" fill="#d62828"/>
  <circle cx="746" cy="362" r="7" fill="#d62828"/>
  <text x="330" y="352" fill="#d62828">Seilende fest</text>
  <text x="762" y="352" fill="#d62828">Seilende mit</text>
  <text x="762" y="370" fill="#d62828">Spannschraube</text>

  <!-- Trommel (590,482), r = 14, berührt den Segmentrand; Seil mehrfach herumgewickelt -->
  <circle cx="590" cy="482" r="20" fill="none" stroke="#d62828" stroke-width="5"/>
  <circle cx="590" cy="482" r="14" fill="#f4a261" stroke="#555" stroke-width="2"/>
  <circle cx="590" cy="482" r="4" fill="#555"/>
  <text x="622" y="478" fill="#333">Seiltrommel Ø 14 mm</text>
  <text x="622" y="497" fill="#d62828">Seil 3–4× herumgewickelt</text>

  <!-- Grosses Zahnrad 96 Z, gleiche Achse wie die Trommel (ein Druckteil) -->
  <circle cx="590" cy="482" r="61" fill="none" stroke="#2a6f97" stroke-width="3" stroke-dasharray="7 5"/>
  <text x="590" y="552" text-anchor="middle" fill="#2a6f97">Zahnrad 96 Zähne, ein Druckteil mit der Trommel</text>

  <!-- Motorritzel 16 Z und Zahnriemen -->
  <rect x="150" y="436" width="92" height="92" rx="8" fill="#cfd8dc" stroke="#555" stroke-width="2"/>
  <text x="196" y="424" text-anchor="middle" fill="#333">Motor</text>
  <circle cx="196" cy="482" r="12" fill="#2a6f97"/>
  <text x="196" y="548" text-anchor="middle" fill="#2a6f97">Ritzel 16 Zähne</text>
  <line x1="194" y1="470" x2="580" y2="422" stroke="#2a6f97" stroke-width="4"/>
  <line x1="194" y1="494" x2="580" y2="542" stroke="#2a6f97" stroke-width="4"/>
  <text x="380" y="428" text-anchor="middle" fill="#2a6f97">Zahnriemen (GT2, 10 mm)</text>

  <!-- Legende -->
  <rect x="24" y="60" width="318" height="120" rx="8" fill="#fafafa" stroke="#bbb"/>
  <line x1="40" y1="88" x2="80" y2="88" stroke="#2a6f97" stroke-width="4"/>
  <text x="92" y="93" fill="#222">Stufe 1: Zahnriemen, 6 : 1</text>
  <line x1="40" y1="120" x2="80" y2="120" stroke="#d62828" stroke-width="5"/>
  <text x="92" y="125" fill="#222">Stufe 2: Seil (Dyneema 1,5 mm), 12 : 1</text>
  <text x="40" y="160" fill="#222">Zusammen 72 : 1</text>

  <!-- Drehpfeil -->
  <path d="M 480 220 A 120 120 0 0 1 700 220" fill="none" stroke="#888" stroke-width="2" marker-end="url(#pf)" marker-start="url(#pf2)"/>
  <defs>
    <marker id="pf" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#888"/></marker>
    <marker id="pf2" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#888"/></marker>
  </defs>
  <text x="590" y="205" text-anchor="middle" fill="#666">Arm schwenkt ±90°</text>
</svg>
